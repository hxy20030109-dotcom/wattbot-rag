[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wattbot-rag"
version = "0.1.0"
description = "Evidence-grounded RAG for the Kaggle WattBot 2026 benchmark"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.0,<4",
  "pypdf>=5.0,<7",
  "numpy>=2.0,<3",
]

[project.optional-dependencies]
dev = ["ruff>=0.9"]

[project.scripts]
wattbot = "wattbot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

